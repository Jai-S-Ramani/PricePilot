<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="26" fill="#FFFFFF"/>
  <rect width="120" height="120" rx="26" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <!-- eBay Multi-Color Letters -->
  <g transform="translate(18, 42)">
    <!-- e (Red) -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#E53238" letter-spacing="-2">e</text>
    <!-- b (Blue) -->
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#0064D2" letter-spacing="-2">b</text>
    <!-- a (Yellow) -->
    <text x="42" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#F5AF02" letter-spacing="-2">a</text>
    <!-- y (Green) -->
    <text x="63" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#86B817" letter-spacing="-2">y</text>
  </g>
  <rect x="35" y="88" width="50" height="12" rx="6" fill="#F1F5F9"/>
  <text x="60" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="7" fill="#64748B" text-anchor="middle" letter-spacing="1">MARKETPLACE</text>
